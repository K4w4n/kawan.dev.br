<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 700" width="1600" height="700" role="img" aria-label="Fluxo: cliente, ordem de serviço com protocolo e comprovante em PDF">
  <rect width="1600" height="700" fill="#1A1A1A" />

  <text x="800" y="110" text-anchor="middle" font-family="'Space Grotesk', 'Inter', sans-serif" font-size="40" font-weight="700" fill="#F9F9F9">Do atendimento ao comprovante</text>
  <text x="800" y="158" text-anchor="middle" font-family="'Inter', sans-serif" font-size="24" fill="#A0A0A0">Três passos, sem caderno e sem planilha</text>

  <g font-family="'Inter', sans-serif" text-anchor="middle">
    <g transform="translate(110 270)">
      <rect width="380" height="190" rx="16" fill="#2C2C2C" stroke="#3A3A3A" stroke-width="2" />
      <text x="190" y="60" font-size="18" font-weight="600" fill="#F5C518" letter-spacing="3">PASSO 1</text>
      <text x="190" y="112" font-size="32" font-weight="600" fill="#F9F9F9">Cliente</text>
      <text x="190" y="152" font-size="22" fill="#A0A0A0">CPF, CNPJ e contato</text>
    </g>

    <g transform="translate(610 270)">
      <rect width="380" height="190" rx="16" fill="#2C2C2C" stroke="#3A3A3A" stroke-width="2" />
      <text x="190" y="60" font-size="18" font-weight="600" fill="#F5C518" letter-spacing="3">PASSO 2</text>
      <text x="190" y="112" font-size="32" font-weight="600" fill="#F9F9F9">Ordem de serviço</text>
      <text x="190" y="152" font-size="22" fill="#A0A0A0">Protocolo 100001</text>
    </g>

    <g transform="translate(1110 270)">
      <rect width="380" height="190" rx="16" fill="#2C2C2C" stroke="#F5C518" stroke-width="3" />
      <text x="190" y="60" font-size="18" font-weight="600" fill="#F5C518" letter-spacing="3">PASSO 3</text>
      <text x="190" y="112" font-size="32" font-weight="600" fill="#F9F9F9">Comprovante</text>
      <text x="190" y="152" font-size="22" fill="#A0A0A0">PDF pronto para enviar</text>
    </g>
  </g>

  <g stroke="#F5C518" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M505 365 L585 365" />
    <path d="M570 350 L590 365 L570 380" />
    <path d="M1005 365 L1085 365" />
    <path d="M1070 350 L1090 365 L1070 380" />
  </g>

  <text x="800" y="570" text-anchor="middle" font-family="'Inter', sans-serif" font-size="22" fill="#A0A0A0">Cada ordem recebe um protocolo sequencial por tenant — começando em 100001.</text>
</svg>
